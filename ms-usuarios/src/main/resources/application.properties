spring.application.name=ms-usuarios

# Puerto propio del microservicio
server.port=8081

# Base de datos MySQL (se crea sola si no existe)
spring.datasource.url=jdbc:mysql://localhost:3306/colegio_usuarios?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=

# JPA: crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
